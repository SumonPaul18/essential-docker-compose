version: "3.8"

services:
  dashy:
    container_name: dashy
    image: lissy93/dashy:latest
    ports:
      - "8085:8080"  # Access Dashy at http://localhost:8085
    volumes:
      - ./dashy-conf:/app/public/conf  # Persistent config storage
      - ./dashy-logs:/app/logs         # Optional: store logs
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "/app/services/healthcheck"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s